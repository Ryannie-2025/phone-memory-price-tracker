<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手机内存RAM和存储ROM详细价格表</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --color-background-primary: #ffffff;
            --color-background-secondary: #f5f5f5;
            --color-text-primary: #000000;
            --color-text-secondary: #888888;
            --color-border-tertiary: rgba(0,0,0,0.15);
            --border-radius-lg: 12px;
            --border-radius-md: 8px;
            --font-sans: 'Segoe UI', system-ui, sans-serif;
        }
        body { font-family: var(--font-sans); margin:0; padding:20px; background: var(--color-background-primary); color: var(--color-text-primary); }
        .container { max-width: 1400px; margin:0 auto; }
        h2 { font-size: 15px; font-weight: 500; margin:0 0 16px 0; }
        .subtitle { font-size: 13px; font-weight: 400; color: var(--color-text-secondary); margin-left: 8px; }
        .update-badge { display:inline-block; font-size:11px; background:rgba(83,74,183,0.1); color:#534AB7; padding:2px 8px; border-radius:4px; margin-left:8px; vertical-align:middle; }
        .tabs { display:flex; gap:8px; margin-bottom:16px; border-bottom:1px solid var(--color-border-tertiary); padding-bottom:8px; }
        .tab { padding:8px 16px; border-radius:6px 6px 0 0; font-size:13px; cursor:pointer; background:var(--color-background-secondary); border:none; color:var(--color-text-primary); }
        .tab.active { background:#534AB7; color:white; }
        .tab:hover:not(.active) { background:#e8e8e8; }
        .tab-content { display:none; }
        .tab-content.active { display:block; }
        .table-wrapper { overflow-x:auto; border:1px solid var(--color-border-tertiary); border-radius:var(--border-radius-lg); margin-bottom:20px; }
        table { width:100%; border-collapse:collapse; font-size:13px; min-width:1000px; }
        th, td { padding:8px 10px; text-align:right; border-bottom:1px solid var(--color-border-tertiary); white-space:nowrap; }
        th:first-child, td:first-child { text-align:left; position:sticky; left:0; background:white; z-index:1; font-weight:600; min-width:140px; }
        th { background:var(--color-background-secondary); font-weight:600; font-size:12px; position:sticky; top:0; z-index:2; }
        th:first-child { z-index:3; }
        tr:hover td { background:#f9f9ff; }
        tr:hover td:first-child { background:#f0f0ff; }
        .predict-col { background:#fffde7 !important; }
        tr:hover .predict-col { background:#f6f6c6 !important; }
        .chart-container { margin-top:20px; padding:20px; border:1px solid var(--color-border-tertiary); border-radius:var(--border-radius-lg); height: 400px; }
        .selected-row { background:#e8e6ff !important; }
        .loading { color:var(--color-text-secondary); font-size:14px; padding:40px; text-align:center; }
        .error { color:#d32f2f; font-size:14px; padding:40px; text-align:center; }
        .note { font-size:12px; color:var(--color-text-secondary); margin-top:8px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>手机内存RAM和存储ROM详细价格表
            <span class="subtitle">单位：USD | 数据来源：TrendForce / CFM闪存市场</span>
            <span class="update-badge" id="update-date">加载中...</span>
        </h2>
        <div class="tabs">
            <button class="tab active" onclick="switchTab(event, 'ram')">内存 (RAM)</button>
            <button class="tab" onclick="switchTab(event, 'rom')">存储 (ROM)</button>
            <button class="tab" onclick="switchTab(event, 'combined')">组合方案 (uMCP)</button>
        </div>
        <div id="tab-ram" class="tab-content active">
            <div class="table-wrapper"><table id="table-ram"></table></div>
            <div class="chart-container"><canvas id="chart-ram"></canvas></div>
        </div>
        <div id="tab-rom" class="tab-content">
            <div class="table-wrapper"><table id="table-rom"></table></div>
            <div class="chart-container"><canvas id="chart-rom"></canvas></div>
        </div>
        <div id="tab-combined" class="tab-content">
            <div class="table-wrapper"><table id="table-combined"></table></div>
            <div class="chart-container"><canvas id="chart-combined"></canvas></div>
        </div>
        <div class="note">💡 点击表格行查看价格趋势图 | 黄色背景列为短期预测(至2026-12) | 趋势图显示到2028年</div>
    </div>

    <script>
    var appData = null;
    var charts = {};

    function loadData() {
        try {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', 'data.json?t=' + Date.now(), true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        try {
                            appData = JSON.parse(xhr.responseText);
                            renderAll();
                        } catch(e) {
                            showError('数据解析失败：' + e.message);
                        }
                    } else {
                        showError('无法加载 data.json (status: ' + xhr.status + ')');
                    }
                }
            };
            xhr.send();
        } catch (e) {
            showError('加载失败：' + e.message);
        }
    }

    function showError(msg) {
        console.error(msg);
        document.querySelector('.container').innerHTML = '<div class="error">' + msg + '<br><br>请检查控制台获取详细信息。</div>';
    }

    function renderAll() {
        var d = appData;
        document.getElementById('update-date').textContent = '数据更新: ' + (d.meta && d.meta.update_date || '未知');
        var tableColCount = 24;
        renderTable('ram', d.months, d.predict_start_index, tableColCount, d.ram);
        renderTable('rom', d.months, d.predict_start_index, tableColCount, d.rom);
        renderTable('combined', d.months, d.predict_start_index, tableColCount, d.combined);
    }

    function renderTable(type, months, predictIdx, tableColCount, dataObj) {
        var table = document.getElementById('table-' + type);
        if (!table) return;
        var html = '<thead><tr><th>规格 / 容量</th>';
        for (var i = 0; i < tableColCount && i < months.length; i++) {
            var m = months[i];
            var cls = (i >= predictIdx) ? ' class="predict-col"' : '';
            html += '<th' + cls + '>' + m + '</th>';
        }
        html += '</tr></thead><tbody>';
        var keys1 = Object.keys(dataObj);
        for (var a = 0; a < keys1.length; a++) {
            var subType = keys1[a];
            var capacities = dataObj[subType];
            var keys2 = Object.keys(capacities);
            for (var b = 0; b < keys2.length; b++) {
                var cap = keys2[b];
                var prices = capacities[cap];
                var rowId = 'row-' + type + '-' + subType + '-' + cap;
                html += '<tr onclick="showChart(\'' + type + '\',\'' + subType + '\',\'' + cap + '\')" id="' + rowId + '">';
                html += '<td>' + subType + ' ' + cap + '</td>';
                for (var i = 0; i < tableColCount && i < prices.length; i++) {
                    var p = prices[i];
                    var cls = (i >= predictIdx) ? 'predict-col' : '';
                    html += '<td class="' + cls + '">' + (p != null ? '$' + p.toFixed(2) : '-') + '</td>';
                }
                html += '</tr>';
            }
        }
        html += '</tbody>';
        table.innerHTML = html;
        var firstRow = table.querySelector('tbody tr');
        if (firstRow) firstRow.click();
    }

    function showChart(type, subType, cap) {
        var table = document.getElementById('table-' + type);
        if (!table) return;
        var rows = table.querySelectorAll('tr');
        for (var i = 0; i < rows.length; i++) rows[i].classList.remove('selected-row');
        var rowId = 'row-' + type + '-' + subType + '-' + cap;
        var row = document.getElementById(rowId);
        if (row) row.classList.add('selected-row');

        var d = appData;
        var prices = d[type][subType][cap];
        var months = d.months;
        var predictIdx = d.predict_start_index;
        var longTermIdx = d.long_term_start_index || 24;
        var canvasId = 'chart-' + type;
        var ctx = document.getElementById(canvasId).getContext('2d');
        if (charts[type]) charts[type].destroy();

        var historicalData = prices.map(function(p,i) { return (i < predictIdx) ? p : null; });
        var shortTermData = prices.map(function(p,i) { return (i >= predictIdx && i < longTermIdx) ? p : null; });
        var longTermData = prices.map(function(p,i) { return (i >= longTermIdx) ? p : null; });

        charts[type] = new Chart(ctx, {
            type: 'line',
            data: {
                labels: months,
                datasets: [
                    {
                        label:'历史价格',
                        data: historicalData,
                        borderColor:'#534AB7',
                        backgroundColor:'rgba(83,74,183,0.1)',
                        fill:true,
                        tension:0.3,
                        pointRadius:3,
                        pointHoverRadius:6,
                        borderWidth:2
                    },
                    {
                        label:'短期预测 (至2026-12)',
                        data: shortTermData,
                        borderColor:'#FF9800',
                        borderDash:[6,3],
                        backgroundColor:'rgba(255,152,0,0.05)',
                        fill:false,
                        tension:0.3,
                        pointRadius:3,
                        pointHoverRadius:6,
                        borderWidth:2
                    },
                    {
                        label:'长期预测 (2027-2028)',
                        data: longTermData,
                        borderColor:'#4CAF50',
                        borderDash:[12,6],
                        backgroundColor:'rgba(76,175,80,0.05)',
                        fill:false,
                        tension:0.3,
                        pointRadius:4,
                        pointHoverRadius:7,
                        borderWidth:2
                    }
                ]
            },
            options: {
                responsive:true,
                maintainAspectRatio:false,
                animation:{duration:600},
                plugins:{
                    title:{
                        display:true,
                        text: subType + ' ' + cap + ' 价格走势（USD）',
                        font:{size:15,weight:'600'},
                        color:'#000'
                    },
                    legend:{
                        position:'bottom',
                        labels:{
                            usePointStyle:true,
                            padding:16,
                            font: { size: 12 }
                        }
                    }
                },
                scales:{
                    y:{
                        beginAtZero:false,
                        ticks:{ callback:function(v) { return '$' + v; } },
                        grid:{ color:'rgba(0,0,0,0.06)' }
                    },
                    x:{
                        grid:{ display:false },
                        ticks:{
                            maxRotation:45,
                            autoSkipPadding:10,
                            font: { size: 11 }
                        }
                    }
                }
            }
        });
    }

    function switchTab(evt, type) {
        var tabs = document.querySelectorAll('.tab');
        for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove('active');
        var contents = document.querySelectorAll('.tab-content');
        for (var i = 0; i < contents.length; i++) contents[i].classList.remove('active');
        evt.target.classList.add('active');
        var tabContent = document.getElementById('tab-' + type);
        if (tabContent) tabContent.classList.add('active');
    }

    loadData();
    setInterval(loadData, 120000);
    </script>
</body>
</html>
